name: Build DVSeasons Optimizer

on:
  push:
    branches:
      - assistant/v11-build-toolchain
    paths:
      - 'Tools/DVSeasonsOptimizer/**'
      - '.github/workflows/build-optimizer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.421

      - name: Restore
        shell: pwsh
        run: dotnet restore Tools/DVSeasonsOptimizer/DVSeasonsOptimizer.csproj

      - name: Build
        shell: pwsh
        run: dotnet build Tools/DVSeasonsOptimizer/DVSeasonsOptimizer.csproj -c Release --no-restore

      - name: Package
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'package'
          $mod = Join-Path $dist 'DVSeasonsOptimizer'
          New-Item -ItemType Directory -Force -Path $mod | Out-Null
          Copy-Item 'Tools/DVSeasonsOptimizer/bin/Release/net472/DVSeasonsOptimizer.dll' $mod
          Copy-Item 'Tools/DVSeasonsOptimizer/Info.json' $mod
          Copy-Item 'Tools/DVSeasonsOptimizer/README.txt' $mod
          Compress-Archive -Path $mod -DestinationPath (Join-Path $env:RUNNER_TEMP 'DVSeasonsOptimizer-0.1.1.zip') -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: DVSeasonsOptimizer-0.1.1
          path: ${{ runner.temp }}/DVSeasonsOptimizer-0.1.1.zip
          compression-level: 0
          retention-days: 3
