name: Build DVSeasons Optimizer

on:
  push:
    branches:
      - assistant/v11-build-toolchain
    paths:
      - 'Tools/DVSeasonsOptimizer/**'
      - '.github/workflows/build-optimizer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.421

      - name: Restore
        run: dotnet restore Tools/DVSeasonsOptimizer/DVSeasonsOptimizer.csproj

      - name: Build
        run: dotnet build Tools/DVSeasonsOptimizer/DVSeasonsOptimizer.csproj -c Release --no-restore

      - name: Prepare installable folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/DVSeasonsOptimizer
          cp Tools/DVSeasonsOptimizer/bin/Release/net472/DVSeasonsOptimizer.dll dist/DVSeasonsOptimizer/
          cp Tools/DVSeasonsOptimizer/Info.json dist/DVSeasonsOptimizer/
          cp Tools/DVSeasonsOptimizer/README.txt dist/DVSeasonsOptimizer/
          test -s dist/DVSeasonsOptimizer/DVSeasonsOptimizer.dll
          test -s dist/DVSeasonsOptimizer/Info.json

      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: DVSeasonsOptimizer-0.1.1-install
          path: dist
          compression-level: 9
          retention-days: 3
